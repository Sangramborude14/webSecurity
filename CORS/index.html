<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORS Lab</title>
</head>
<body>
    <h1>CORS Learning Lab</h1>
    <button onclick= {fetchData()}>
        Fetch data from backend
    </button>
    <br>
    <button onClick= {testPreflight()}>
        Test Preflight
    </button>
    <br>
    <button onclick={testCredentials()}>
        Test Credential
    </button>

    <script>
        async function fetchData(){
            try{
                const response = await fetch(`http://localhost:5000/api/data`);
                const data = await response.json();
                console.log('Success: ',data);
            }catch(err){
                console.error(`Error fetching data`,err);
            }
        }

        async function testPreflight() {
            try {
                const response = await fetch(`http://localhost:5000/api/preflight`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Custom-Header': 'MySercetValue',
                    },
                    body: JSON.stringify({name: 'Sangram'})
                })
                const data = await response.json();
                console.log('PUT sucess: ', data);
            }catch(err){
                console.error('Put Error: ',err);
            }
        }
        async function testCredentials(){
            try {
                const response = await fetch('http://localhost:5000/api/credentials', {
                    method: 'POST',
                    credentials: 'include', // send cookies/credential cross origin
                });
                const data = await response.json();
                console.log('Credential success: ',data);
            }catch(err){
                console.error('credential Error: ',err); 
            }
        }
    </script>
</body>
</html>
